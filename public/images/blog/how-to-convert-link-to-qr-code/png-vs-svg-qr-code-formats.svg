<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background -->
  <rect width="860" height="300" rx="20" fill="#1e2129"/>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.7" fill="rgba(200,205,220,0.07)"/>
    </pattern>
    <linearGradient id="pngGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.08"/>
    </linearGradient>
    <linearGradient id="svgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.08"/>
    </linearGradient>
  </defs>
  <rect width="860" height="300" rx="20" fill="url(#dots)"/>

  <!-- Header -->
  <text x="430" y="38" text-anchor="middle" font-size="15" fill="rgba(255,255,255,0.9)" font-weight="700" letter-spacing="0.5">PNG vs SVG — Which Format Should You Download?</text>
  <line x1="60" y1="52" x2="800" y2="52" stroke="rgba(200,205,220,0.10)" stroke-width="1"/>

  <!-- PNG card (left) -->
  <rect x="40" y="68" width="370" height="210" rx="18" fill="url(#pngGrad)" stroke="rgba(99,102,241,0.28)" stroke-width="1.5"/>

  <!-- PNG icon area -->
  <rect x="60" y="90" width="70" height="70" rx="14" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
  <!-- Pixelated QR to show raster -->
  <rect x="68" y="98" width="8" height="8" fill="#818cf8"/>
  <rect x="78" y="98" width="8" height="8" fill="#818cf8"/>
  <rect x="88" y="98" width="8" height="8" fill="#818cf8"/>
  <rect x="68" y="108" width="8" height="8" fill="#818cf8"/>
  <rect x="88" y="108" width="8" height="8" fill="#818cf8"/>
  <rect x="68" y="118" width="8" height="8" fill="#818cf8"/>
  <rect x="78" y="118" width="8" height="8" fill="#818cf8"/>
  <rect x="88" y="118" width="8" height="8" fill="#818cf8"/>
  <rect x="98" y="98" width="26" height="8" fill="#818cf8" opacity="0.5"/>
  <rect x="98" y="108" width="12" height="8" fill="#818cf8" opacity="0.5"/>
  <rect x="113" y="108" width="11" height="8" fill="#818cf8" opacity="0.5"/>
  <rect x="98" y="118" width="26" height="8" fill="#818cf8" opacity="0.5"/>
  <!-- Blur/pixel overlay for PNG concept -->
  <rect x="68" y="136" width="54" height="16" rx="3" fill="rgba(239,68,68,0.15)" stroke="rgba(239,68,68,0.3)" stroke-width="0.5"/>
  <text x="95" y="148" text-anchor="middle" font-size="8" fill="#fca5a5">blurs when enlarged</text>

  <!-- PNG label + details -->
  <text x="146" y="97" font-size="22" fill="#818cf8" font-weight="800">.PNG</text>
  <text x="146" y="117" font-size="11.5" fill="rgba(255,255,255,0.55)">Raster image — fixed resolution</text>

  <!-- PNG use cases -->
  <g transform="translate(60, 172)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Website pages and landing pages</text>
  </g>
  <g transform="translate(60, 196)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Emails and presentations</text>
  </g>
  <g transform="translate(60, 220)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Social media posts</text>
  </g>
  <g transform="translate(60, 244)">
    <circle cx="7" cy="7" r="5" fill="rgba(239,68,68,0.2)" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#fca5a5">✗</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.4)">Print at large sizes (blurs)</text>
  </g>

  <!-- VS divider -->
  <text x="430" y="180" text-anchor="middle" font-size="18" fill="rgba(245,158,11,0.8)" font-weight="800">VS</text>
  <line x1="430" y1="68" x2="430" y2="278" stroke="rgba(200,205,220,0.08)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- SVG card (right) -->
  <rect x="450" y="68" width="370" height="210" rx="18" fill="url(#svgGrad)" stroke="rgba(16,185,129,0.28)" stroke-width="1.5"/>

  <!-- SVG icon area — crisp at all sizes -->
  <rect x="470" y="90" width="70" height="70" rx="14" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <!-- Clean vector QR -->
  <rect x="478" y="98" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="489" y="98" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="500" y="98" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="478" y="109" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="500" y="109" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="478" y="120" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="489" y="120" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="500" y="120" width="9" height="9" rx="1" fill="#34d399"/>
  <rect x="511" y="98" width="27" height="9" rx="1" fill="#34d399" opacity="0.6"/>
  <rect x="511" y="109" width="13" height="9" rx="1" fill="#34d399" opacity="0.6"/>
  <rect x="526" y="109" width="12" height="9" rx="1" fill="#34d399" opacity="0.6"/>
  <rect x="511" y="120" width="27" height="9" rx="1" fill="#34d399" opacity="0.6"/>
  <!-- Sharp badge -->
  <rect x="478" y="136" width="54" height="16" rx="3" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="0.5"/>
  <text x="505" y="148" text-anchor="middle" font-size="8" fill="#6ee7b7">stays sharp always</text>

  <!-- SVG label + details -->
  <text x="556" y="97" font-size="22" fill="#34d399" font-weight="800">.SVG</text>
  <text x="556" y="117" font-size="11.5" fill="rgba(255,255,255,0.55)">Vector image — scales infinitely</text>

  <!-- SVG use cases -->
  <g transform="translate(470, 172)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Business cards and flyers</text>
  </g>
  <g transform="translate(470, 196)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Product packaging and labels</text>
  </g>
  <g transform="translate(470, 220)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Signage and banners (any size)</text>
  </g>
  <g transform="translate(470, 244)">
    <circle cx="7" cy="7" r="5" fill="rgba(16,185,129,0.25)" stroke="rgba(16,185,129,0.5)" stroke-width="1"/>
    <text x="7" y="11" text-anchor="middle" font-size="9" fill="#6ee7b7">✓</text>
    <text x="20" y="11" font-size="12" fill="rgba(255,255,255,0.7)">Professional print production</text>
  </g>

  <!-- Footer tag -->
  <text x="430" y="293" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.2)" letter-spacing="1">linklab.in — free qr code generator</text>
</svg>

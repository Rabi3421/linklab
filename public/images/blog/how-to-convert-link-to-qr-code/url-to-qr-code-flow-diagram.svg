<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" style="font-family: system-ui, -apple-system, sans-serif;">
  <!-- Background -->
  <rect width="900" height="340" rx="20" fill="#1e2129"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="rgba(200,205,220,0.08)"/>
    </pattern>
  </defs>
  <rect width="900" height="340" rx="20" fill="url(#grid)"/>

  <!-- ── Step 1: URL ── -->
  <g transform="translate(46, 90)">
    <!-- Card -->
    <rect width="148" height="160" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(200,205,220,0.15)" stroke-width="1"/>
    <!-- Icon area -->
    <rect x="44" y="20" width="60" height="60" rx="12" fill="rgba(99,102,241,0.18)" stroke="rgba(99,102,241,0.35)" stroke-width="1"/>
    <!-- Link icon -->
    <text x="74" y="61" text-anchor="middle" font-size="28" fill="#818cf8">🔗</text>
    <!-- Step badge -->
    <rect x="54" y="89" width="40" height="20" rx="10" fill="rgba(99,102,241,0.25)"/>
    <text x="74" y="103" text-anchor="middle" font-size="11" fill="#a5b4fc" font-weight="600">STEP 1</text>
    <!-- Label -->
    <text x="74" y="127" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">Your URL</text>
    <text x="74" y="145" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.4)">Any web address</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(202, 155)">
    <line x1="0" y1="15" x2="50" y2="15" stroke="rgba(245,158,11,0.5)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="46,10 56,15 46,20" fill="rgba(245,158,11,0.7)"/>
  </g>

  <!-- ── Step 2: QR Generator ── -->
  <g transform="translate(260, 90)">
    <rect width="148" height="160" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(200,205,220,0.15)" stroke-width="1"/>
    <rect x="44" y="20" width="60" height="60" rx="12" fill="rgba(245,158,11,0.18)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
    <text x="74" y="61" text-anchor="middle" font-size="28" fill="#fbbf24">⚡</text>
    <rect x="44" y="89" width="60" height="20" rx="10" fill="rgba(245,158,11,0.25)"/>
    <text x="74" y="103" text-anchor="middle" font-size="11" fill="#fcd34d" font-weight="600">STEP 2</text>
    <text x="74" y="127" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">QR Generator</text>
    <text x="74" y="145" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.4)">Paste &amp; convert</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(416, 155)">
    <line x1="0" y1="15" x2="50" y2="15" stroke="rgba(245,158,11,0.5)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="46,10 56,15 46,20" fill="rgba(245,158,11,0.7)"/>
  </g>

  <!-- ── Step 3: QR Code ── -->
  <g transform="translate(474, 90)">
    <rect width="148" height="160" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(200,205,220,0.15)" stroke-width="1"/>
    <!-- QR code visual -->
    <rect x="44" y="20" width="60" height="60" rx="12" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
    <!-- Mini QR pattern -->
    <rect x="51" y="27" width="18" height="18" rx="2" fill="rgba(16,185,129,0.7)"/>
    <rect x="77" y="27" width="18" height="18" rx="2" fill="rgba(16,185,129,0.7)"/>
    <rect x="51" y="53" width="18" height="18" rx="2" fill="rgba(16,185,129,0.7)"/>
    <rect x="77" y="53" width="7" height="7" rx="1" fill="rgba(16,185,129,0.7)"/>
    <rect x="87" y="53" width="7" height="7" rx="1" fill="rgba(16,185,129,0.7)"/>
    <rect x="77" y="63" width="7" height="7" rx="1" fill="rgba(16,185,129,0.7)"/>
    <!-- Inner squares -->
    <rect x="55" y="31" width="10" height="10" rx="1" fill="#1e2129"/>
    <rect x="81" y="31" width="10" height="10" rx="1" fill="#1e2129"/>
    <rect x="55" y="57" width="10" height="10" rx="1" fill="#1e2129"/>
    <rect x="44" y="89" width="60" height="20" rx="10" fill="rgba(16,185,129,0.25)"/>
    <text x="74" y="103" text-anchor="middle" font-size="11" fill="#6ee7b7" font-weight="600">STEP 3</text>
    <text x="74" y="127" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">QR Code</text>
    <text x="74" y="145" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.4)">PNG or SVG</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(630, 155)">
    <line x1="0" y1="15" x2="50" y2="15" stroke="rgba(245,158,11,0.5)" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="46,10 56,15 46,20" fill="rgba(245,158,11,0.7)"/>
  </g>

  <!-- ── Step 4: Scan & Share ── -->
  <g transform="translate(688, 90)">
    <rect width="148" height="160" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(200,205,220,0.15)" stroke-width="1"/>
    <rect x="44" y="20" width="60" height="60" rx="12" fill="rgba(239,68,68,0.18)" stroke="rgba(239,68,68,0.35)" stroke-width="1"/>
    <text x="74" y="61" text-anchor="middle" font-size="28" fill="#f87171">📱</text>
    <rect x="44" y="89" width="60" height="20" rx="10" fill="rgba(239,68,68,0.25)"/>
    <text x="74" y="103" text-anchor="middle" font-size="11" fill="#fca5a5" font-weight="600">STEP 4</text>
    <text x="74" y="127" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.85)" font-weight="600">Scan &amp; Share</text>
    <text x="74" y="145" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.4)">Print or digital</text>
  </g>

  <!-- ── Bottom row: PNG vs SVG comparison ── -->
  <g transform="translate(46, 278)">
    <!-- PNG pill -->
    <rect width="180" height="36" rx="18" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
    <text x="22" y="23" font-size="12" fill="#a5b4fc" font-weight="700">PNG</text>
    <text x="50" y="23" font-size="12" fill="rgba(255,255,255,0.45)">— Digital use (web, email)</text>
  </g>

  <g transform="translate(260, 278)">
    <!-- SVG pill -->
    <rect width="180" height="36" rx="18" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
    <text x="22" y="23" font-size="12" fill="#6ee7b7" font-weight="700">SVG</text>
    <text x="50" y="23" font-size="12" fill="rgba(255,255,255,0.45)">— Print (scales perfectly)</text>
  </g>

  <g transform="translate(474, 278)">
    <!-- Dynamic pill -->
    <rect width="380" height="36" rx="18" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
    <text x="22" y="23" font-size="12" fill="#fcd34d" font-weight="700">Dynamic QR</text>
    <text x="110" y="23" font-size="12" fill="rgba(255,255,255,0.45)">— Update destination + get scan analytics</text>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.35)" letter-spacing="2">HOW TO CONVERT A LINK TO A QR CODE</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.2)" letter-spacing="1">linklab.in</text>
</svg>

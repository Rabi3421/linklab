<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2129"/>
      <stop offset="100%" style="stop-color:#252b38"/>
    </linearGradient>
    <pattern id="dotV" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.7" fill="rgba(200,205,220,0.07)"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="20" fill="url(#bgV)"/>
  <rect width="900" height="300" rx="20" fill="url(#dotV)"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.85)" font-weight="700">ITF-14 vs EAN-13 vs Code 128 — Which Barcode for Which Package?</text>
  <line x1="50" y1="50" x2="850" y2="50" stroke="rgba(200,205,220,0.10)" stroke-width="1"/>

  <!-- LEFT CARD: ITF-14 (emerald) — outer carton -->
  <g transform="translate(40, 62)">
    <rect width="256" height="210" rx="14" fill="rgba(16,185,129,0.09)" stroke="rgba(16,185,129,0.40)" stroke-width="1.5"/>
    <rect x="0" y="0" width="256" height="54" rx="14" fill="rgba(16,185,129,0.16)"/>
    <rect x="0" y="40" width="256" height="14" fill="rgba(16,185,129,0.16)"/>
    <text x="128" y="24" text-anchor="middle" font-size="16" fill="#6ee7b7" font-weight="700">ITF-14</text>
    <text x="128" y="44" text-anchor="middle" font-size="10" fill="rgba(110,231,183,0.65)" letter-spacing="1">OUTER CARTON / SHIPPING BOX</text>
    <!-- Icon: box outline -->
    <text x="128" y="86" text-anchor="middle" font-size="24" fill="#6ee7b7">&#9634;</text>
    <text x="128" y="104" text-anchor="middle" font-size="9.5" fill="rgba(110,231,183,0.55)">Corrugated · Wholesale · Warehouse</text>
    <line x1="20" y1="114" x2="236" y2="114" stroke="rgba(16,185,129,0.15)" stroke-width="1"/>
    <text x="22" y="132" font-size="10.5" fill="rgba(255,255,255,0.45)">Digits</text>
    <text x="234" y="132" text-anchor="end" font-size="11" fill="#6ee7b7" font-weight="600">14</text>
    <text x="22" y="152" font-size="10.5" fill="rgba(255,255,255,0.45)">GS1 required</text>
    <text x="234" y="152" text-anchor="end" font-size="11" fill="#6ee7b7">Yes (GTIN-14)</text>
    <text x="22" y="172" font-size="10.5" fill="rgba(255,255,255,0.45)">Bearer bar</text>
    <text x="234" y="172" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">Required</text>
    <text x="22" y="192" font-size="10.5" fill="rgba(255,255,255,0.45)">Scanned by</text>
    <text x="234" y="192" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">Warehouse / 3PL</text>
    <rect x="20" y="200" width="140" height="18" rx="9" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" font-size="9.5" fill="#6ee7b7" font-weight="600">For cases, cartons, pallets</text>
  </g>

  <!-- MIDDLE CARD: EAN-13 (amber) — individual retail item -->
  <g transform="translate(322, 62)">
    <rect width="256" height="210" rx="14" fill="rgba(245,158,11,0.09)" stroke="rgba(245,158,11,0.35)" stroke-width="1.5"/>
    <rect x="0" y="0" width="256" height="54" rx="14" fill="rgba(245,158,11,0.16)"/>
    <rect x="0" y="40" width="256" height="14" fill="rgba(245,158,11,0.16)"/>
    <text x="128" y="24" text-anchor="middle" font-size="16" fill="#fcd34d" font-weight="700">EAN-13</text>
    <text x="128" y="44" text-anchor="middle" font-size="10" fill="rgba(252,211,77,0.65)" letter-spacing="1">INDIVIDUAL RETAIL PRODUCT</text>
    <!-- Icon: tag shape -->
    <text x="128" y="86" text-anchor="middle" font-size="24" fill="#fcd34d">&#9645;</text>
    <text x="128" y="104" text-anchor="middle" font-size="9.5" fill="rgba(252,211,77,0.55)">Shelf · Checkout · Amazon listing</text>
    <line x1="20" y1="114" x2="236" y2="114" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <text x="22" y="132" font-size="10.5" fill="rgba(255,255,255,0.45)">Digits</text>
    <text x="234" y="132" text-anchor="end" font-size="11" fill="#fcd34d" font-weight="600">13</text>
    <text x="22" y="152" font-size="10.5" fill="rgba(255,255,255,0.45)">GS1 required</text>
    <text x="234" y="152" text-anchor="end" font-size="11" fill="#fca5a5">Yes (GTIN-13)</text>
    <text x="22" y="172" font-size="10.5" fill="rgba(255,255,255,0.45)">Bearer bar</text>
    <text x="234" y="172" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">Not used</text>
    <text x="22" y="192" font-size="10.5" fill="rgba(255,255,255,0.45)">Scanned by</text>
    <text x="234" y="192" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">POS / Consumer apps</text>
    <rect x="20" y="200" width="140" height="18" rx="9" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" font-size="9.5" fill="#fcd34d" font-weight="600">For individual sale units</text>
  </g>

  <!-- RIGHT CARD: Code 128 (indigo) — internal / logistics -->
  <g transform="translate(604, 62)">
    <rect width="256" height="210" rx="14" fill="rgba(99,102,241,0.09)" stroke="rgba(99,102,241,0.30)" stroke-width="1.5"/>
    <rect x="0" y="0" width="256" height="54" rx="14" fill="rgba(99,102,241,0.15)"/>
    <rect x="0" y="40" width="256" height="14" fill="rgba(99,102,241,0.15)"/>
    <text x="128" y="24" text-anchor="middle" font-size="16" fill="#a5b4fc" font-weight="700">Code 128</text>
    <text x="128" y="44" text-anchor="middle" font-size="10" fill="rgba(165,180,252,0.65)" letter-spacing="1">INTERNAL / LOGISTICS / HEALTHCARE</text>
    <!-- Icon: tag shape -->
    <text x="128" y="86" text-anchor="middle" font-size="24" fill="#a5b4fc">&#9632;</text>
    <text x="128" y="104" text-anchor="middle" font-size="9.5" fill="rgba(165,180,252,0.55)">Inventory · Shipping label · ID badge</text>
    <line x1="20" y1="114" x2="236" y2="114" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
    <text x="22" y="132" font-size="10.5" fill="rgba(255,255,255,0.45)">Digits</text>
    <text x="234" y="132" text-anchor="end" font-size="11" fill="#a5b4fc" font-weight="600">No limit</text>
    <text x="22" y="152" font-size="10.5" fill="rgba(255,255,255,0.45)">GS1 required</text>
    <text x="234" y="152" text-anchor="end" font-size="11" fill="#6ee7b7">No</text>
    <text x="22" y="172" font-size="10.5" fill="rgba(255,255,255,0.45)">Bearer bar</text>
    <text x="234" y="172" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">Not used</text>
    <text x="22" y="192" font-size="10.5" fill="rgba(255,255,255,0.45)">Scanned by</text>
    <text x="234" y="192" text-anchor="end" font-size="11" fill="rgba(255,255,255,0.7)">Any scanner / mobile</text>
    <rect x="20" y="200" width="140" height="18" rx="9" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
    <text x="90" y="213" text-anchor="middle" font-size="9.5" fill="#a5b4fc">For any text / internal data</text>
  </g>

  <!-- BOTTOM NOTE -->
  <text x="450" y="288" text-anchor="middle" font-size="10.5" fill="rgba(16,185,129,0.7)">You typically need all three: EAN-13 on the product, ITF-14 on the case, Code 128 on internal shipping labels.</text>
</svg>
